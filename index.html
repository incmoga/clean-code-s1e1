<!DOCTYPE html>
<html>
<head>
  <title>Todo App</title>
<link 
  href="https://fonts.googleapis.com/css?family=Lato:300,400,700" 
  rel="stylesheet">
<link 
  rel="stylesheet" 
  href="style.css" 
  media="screen" 
  charset="utf-8">
</head>
<body>
  <header class="header">
    <div class="header__wrapper">
      <img
        class="header__image"
        src="./eisenhower-matrix.jpg"
        alt="Eisenhower Decision Matrix"
      >
      <a
        class="header__link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </div>
  </header>
    <main class="main">
      <div class="todo-app">
        <section class="add-form" id="add-form">
          <h2 class="add-form__title" for="new-task">Add Item</h2>
          <form class="add-form__form">
            <div class="add-form__input-wrapper">
              <input
                class="add-form__input"
                id="new-task"
                type="text"
              >
              <button class="add-form__submit">Add</button>
            </div>
          </form>
        </section>
        <section class="task-list task-list--active">
          <h2 class="task-list__title">Todo</h2>
          <ul class="task-list__items" id="active-tasks">
            <li class="task-list__item">
              <input class="task-list__checkbox" type="checkbox">
              <label class="task-list__text">Pay Bills</label>
              <input class="task-list__edit-input" type="text">
              <button class="task-list__edit-btn">Edit</button>
              <button class="task-list__delete-btn">
                <img
                  class="task-list__icon-remove"
                  src="./remove.svg"
                  alt="Icon for remove task"
                >
              </button>
            </li>
            <li class="task-list__item task-list__item--editing">
              <input class="task-list__checkbox" type="checkbox">
              <label class="task-list__text">Go Shopping</label>
              <input class="task-list__edit-input" type="text"value="Go Shopping">
              <button class="task-list__edit-btn">Save</button>
              <button class="task-list__delete-btn">
                <img
                  class="task-list__icon-remove"
                  src="./remove.svg"
                  alt="Icon for remove task"
                >
              </button>
            </li>
          </ul>
        </section>
        <section class="task-list task-list--completed">
          <h2 class="task-list__title">Completed</h2>
          <ul class="task-list__items" id="completed-tasks">
            <li class="task-list__item task-list__item--completed">
              <input class="task-list__checkbox" type="checkbox" checked>
              <label class="task-list__text">See the Doctor</label>
              <input class="task-list__edit-input" type="text" >
              <button class="task-list__edit-btn">Edit</button>
              <button class="task-list__delete-btn">
                <img
                  class="task-list__icon-remove"
                  src="./remove.svg"
                  alt="Icon for remove task"
                >
              </button>
            </li>
          </ul>
        </section>
      </div>
    </main>
  <script src="app.js"></script>
</body>
</html>
