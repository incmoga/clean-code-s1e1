<!DOCTYPE html>
<html>
<head>
  <title>Todo App</title>
<link 
  href="https://fonts.googleapis.com/css?family=Lato:300,400,700" 
  rel="stylesheet">
<link 
  rel="stylesheet" 
  href="style.css" 
  media="screen" 
  charset="utf-8">
</head>
<body>
  <header class="header">
    <div class="header-wrapper">
      <img
        src="./eisenhower-matrix.jpg"
        alt="Eisenhower Decision Matrix"
      >
      <a
        class="info"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
          Want more details?
      </a>
    </div>
  </header>
    <main class="main">
      <div class="todo-toolbar">
        <section class="" id="add-form">
          <h2 for="new-task">Add Item</h2>
          <form class="">
            <div class="task-row-wrapper">
              <input
                id="new-task"
                class="task"
                type="text"
              >
              <button>Add</button>
            </div>
          </form>
        </section>
        <section class="">
          <h2>Todo</h2>
          <ul id="active-tasks">
            <li>
              <input type="checkbox">
              <label class="task">Pay Bills</label>
              <input type="text" class="task">
              <button class="btn-edit">Edit</button>
              <button class="btn-delete">
                <img
                  src="./remove.svg"
                  alt="Icon for remove task"
                >
              </button></li>
            <li class="edit-mode">
              <input type="checkbox">
              <label class="task">Go Shopping</label>
              <input
                type="text"
                value="Go Shopping"
                class="task">
              <button class="btn-edit">Save</button>
              <button class="btn-delete">
                <img
                  src="./remove.svg"
                  alt="Icon for remove task"
                >
              </button></li>
          </ul>
        </section>
        <section class="">
          <h2>Completed</h2>
          <ul id="completed-tasks">
            <li>
              <input type="checkbox" checked>
              <label class="task">See the Doctor</label><input type="text" class="task">
              <button class="btn-edit">Edit</button>
              <button class="btn-delete">
                <img
                  src="./remove.svg"
                  alt="Icon for remove task"
                >
              </button>
            </li>
          </ul>
        </section>
      </div>
    </main>
  <script src="app.js"></script>
</body>
</html>
